<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b70">
<title>مركز بحث قاعدة العملاء</title>
<style>
:root{
 --nav:#173b70;--nav2:#0e2a52;--accent:#f4b41a;--bg:#f3f6fa;--card:#fff;
 --text:#172033;--muted:#6b7280;--line:#e3e8ef;--ok:#16805b;--danger:#b42318;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,var(--nav),var(--nav2));color:#fff;padding:18px 16px 26px}
.wrap{max-width:1120px;margin:auto}.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:14px;background:#fff;color:var(--nav);display:grid;place-items:center;font-weight:900;font-size:25px}
h1{margin:0;font-size:23px}.subtitle{font-size:12px;opacity:.8;margin-top:5px}
.panel{background:#fff;margin:-10px auto 0;border-radius:20px;box-shadow:0 10px 35px #102a4b18;padding:15px;position:relative}
.search{display:flex;gap:9px}.search input{flex:1;min-width:0;border:2px solid #d9e0e9;border-radius:13px;padding:15px;font-size:17px;outline:none}
.search input:focus{border-color:#356bc0;box-shadow:0 0 0 4px #356bc018}
button{border:0;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer}.search-btn{background:var(--nav);color:#fff;min-width:105px}
.clear{background:#eef2f6;color:#344054}.results-count{font-size:12px;color:var(--muted);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px auto}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden;box-shadow:0 5px 18px #102a4b0b}
.cardhead{padding:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:linear-gradient(180deg,#fff,#fafcff);border-bottom:1px solid var(--line)}
.name{font-size:18px;font-weight:900}.nid{font-size:12px;color:var(--muted);margin-top:6px}
.badge{background:#edf4ff;color:#245ca8;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr)}
.field{padding:12px 16px;border-bottom:1px solid #eef1f4}.field:nth-child(odd){border-left:1px solid #eef1f4}
.label{font-size:10px;color:var(--muted);margin-bottom:5px}.value{font-size:13px;word-break:break-word}
.actions{display:flex;gap:8px;padding:12px 16px;background:#fafbfc}
.copy{background:var(--nav);color:#fff;padding:10px 13px}.copy.ok{background:var(--ok)}
.empty{text-align:center;padding:45px 20px;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:18px;margin-top:15px}
mark{background:#fff1a8;border-radius:3px;padding:0 2px}
footer{text-align:center;color:#98a2b3;font-size:10px;padding:25px}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.search{flex-direction:column}.search button{height:44px}.search-btn{width:100%}.grid{grid-template-columns:1fr}.field:nth-child(odd){border-left:0}.cardhead{flex-direction:column}}
</style>
</head>
<body>
<header><div class="wrap brand"><div class="logo">⌕</div><div>
<h1>مركز بحث قاعدة العملاء</h1><div class="subtitle">التطبيق الجاهز للبحث السريع في قاعدة البيانات</div>
</div></div></header>

<main class="wrap">
<section class="panel">
<div class="search">
<input id="q" autocomplete="off" placeholder="اكتب الاسم أو الرقم القومي أو رقم الهاتف أو العنوان...">
<button type="button" class="search-btn" onclick="search()">🔎 بحث</button>
<button type="button" class="clear" onclick="clearSearch()">مسح</button>
</div>
<div class="results-count" id="hint">اكتب بيانات البحث ثم اضغط 🔎 بحث</div>
</section>

<section class="stats">
<div class="stat"><b id="total">0</b><span>إجمالي السجلات</span></div>
<div class="stat"><b id="found">0</b><span>نتائج البحث</span></div>
<div class="stat"><b>✓</b><span>التكرار بالرقم القومي مستبعد</span></div>
</section>

<section id="results"><div class="empty">🔎 ابدأ البحث عن أي عميل</div></section>
</main>
<footer>مركز بحث قاعدة العملاء • نسخة جاهزة للاستخدام</footer>

function normalize(v){
 return String(v??"").toLowerCase()
 .replace(/[إأآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
 .replace(/[ًٌٍَُِّْـ]/g,"")
 .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
 .replace(/\s+/g,"").trim();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hi(s,q){
 let out=esc(s); if(!q)return out;
 const terms=q.trim().split(/\s+/).filter(Boolean);
 for(const term of terms){
  const raw=esc(term); if(!raw)continue;
  try{out=out.replace(new RegExp("("+raw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")}catch(e){}
 }
 return out;
}
function search(){
 const q=document.getElementById("q").value,nq=normalize(q),box=document.getElementById("results");
 if(!nq){box.innerHTML='<div class="empty">🔎 ابدأ البحث عن أي عميل</div>';document.getElementById("found").textContent="0";document.getElementById("hint").textContent="اكتب بيانات البحث ثم اضغط 🔎 بحث";return}
 const hits=DATA.map((r,i)=>({r,i,h:Object.values(r).map(normalize).join(" ")})).filter(x=>x.h.includes(nq));
 document.getElementById("found").textContent=hits.length.toLocaleString("ar-EG");
 document.getElementById("hint").textContent=hits.length?`تم العثور على ${hits.length.toLocaleString("ar-EG")} نتيجة`:"لم يتم العثور على نتيجة مطابقة";
 if(!hits.length){box.innerHTML='<div class="empty">❌ مفيش نتيجة مطابقة<br><small>جرّب جزء أصغر من الاسم أو الرقم.</small></div>';return}
 box.innerHTML=hits.slice(0,100).map(x=>card(x.r,x.i,q)).join("");
}
function card(r,i,q){
 let fields="";
 for(const [k,v] of Object.entries(r)){if(!String(v).trim())continue;fields+=`<div class="field"><div class="label">${esc(k)}</div><div class="value">${hi(v,q)}</div></div>`}
 const txt=Object.entries(r).filter(([k,v])=>String(v).trim()).map(([k,v])=>`${k}: ${v}`).join("\n");
 return `<article class="card"><div class="cardhead"><div><div class="name">${hi(r["الاسم"]||"بدون اسم",q)}</div><div class="nid">الرقم القومي: ${esc(r["الرقم القومي"]||"غير مسجل")}</div></div><div class="badge">سجل ${i+1}</div></div><div class="grid">${fields}</div><div class="actions"><button class="copy" onclick='copyData(${JSON.stringify(txt)})'>📋 نسخ بيانات العميل</button></div></article>`;
}
async function copyData(t){
 try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}
 alert("تم نسخ بيانات العميل ✅");
}
function clearSearch(){document.getElementById("q").value="";search();document.getElementById("q").focus()}
document.getElementById("total").textContent=DATA.length.toLocaleString("ar-EG");
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();search();}});
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Escape")clearSearch()});
